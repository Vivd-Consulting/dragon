services:
  client:
    build:
      context: client/.
      dockerfile: Dockerfile-dev
    env_file:
      - client/.env.development
    volumes:
      - ./client/.:/opt/client
      - /opt/client/node_modules
      - /opt/client/.next
    ports:
      - "3000:3000"
    stdin_open: true
    restart: always
    image: "dragon_client:latest"
  
  inngest:
    image: inngest/inngest:latest
    container_name: dragon-inngest
    command: inngest start --event-key ${INNGEST_EVENT_KEY} --signing-key ${INNGEST_SIGNING_KEY} -u http://host.docker.internal:3000/api/ai/funnels
    ports:
      - "8288:8288"
    depends_on:
      - client
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dragon_default

  postgres:
    image: postgres:15
    container_name: db
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
        - "6543:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pgpass

volumes:
  db_data:
